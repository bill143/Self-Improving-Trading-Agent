# What success and failure look like. The scorer reads this to grade trades.
# Edit these to match your own strategy (these are sensible starting defaults).
asset: "BTC/USDT"
target_return_30d: 0.05    # success: +5% over a 30-day window
max_drawdown:      0.08    # failure: bail above 8% peak-to-trough drawdown
min_sharpe:        1.2     # quality bar: risk-adjusted return must clear this
failure_below:     -0.04   # score floor: returns below this are steeply punished
reflection_every:  5       # reflect after this many closed trades
one_variable_only: true    # scientific-method guardrail: change exactly one variable per cycle
