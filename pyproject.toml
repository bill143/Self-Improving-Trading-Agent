[project]
name = "hermes-trading"
version = "0.1.0"
description = "A self-improving paper-trading worker: pulls market data, takes paper trades against a versioned strategy, scores outcomes, and reflects to evolve one variable at a time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.2",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=23.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agency = ["anthropic>=0.116"]
compliance = ["anthropic>=0.116", "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1"]

[project.scripts]
hermes-trading = "hermes_trading.run:main"
agency-team = "agency_team.__main__:main"
everlasting-compliance = "everlasting_compliance.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_trading", "agency_team", "everlasting_compliance"]
